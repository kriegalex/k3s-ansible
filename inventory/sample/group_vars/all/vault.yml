# YOU MUST ENCRYPT THIS WITH
# ansible-vault encrypt --vault-password-file .vault_pass \
#  --encrypt-vault-id default group_vars/all/vault.yml --output group_vars/all/vault.yml
---
# K3s cluster token (required for all deployments)
# Generate with: openssl rand -base64 32
k3s_token: "SUPER_LONG_PASSWORD_32BITS_ALPHANUMERICAL"

# Join existing cluster token (optional - only needed when join_existing_cluster=true)
# Get this from the existing cluster: sudo cat /var/lib/rancher/k3s/server/node-token
# existing_cluster_token: "K1234567890abcdef::server:abcdef1234567890"
