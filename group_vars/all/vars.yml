---
k3s_version: v1.34.9+k3s1
ansible_user: k3s
ansible_python_interpreter: /usr/bin/python3

api_endpoint: 10.0.0.10
api_port: 6443

# Keep the kubeconfig context name the cluster already uses.
cluster_context: default
user_kubectl: true

# LoadBalancer pool advertised by MetalLB (L2) — rendered into
# manifests/rendered/metallb-pools.yaml by the pre-play in site.yml.
metallb_ip_range: 10.0.0.20-10.0.0.49
