---
# This role joins a new k3s server to an existing cluster
# It differs from k3s_server in that it:
# - Does NOT initialize a new cluster (no --cluster-init)
# - Uses --server flag to point to existing cluster
# - Does NOT deploy VIP, MetalLB, or kube-vip manifests (existing cluster already has them)

- name: Validate join cluster prerequisites
  ansible.builtin.assert:
    that:
      - existing_cluster_apiserver is defined
      - existing_cluster_apiserver | ansible.utils.ipaddr or existing_cluster_apiserver | ansible.utils.ipv6
      - existing_cluster_token is defined or k3s_token is defined
      - k3s_version is defined
      - k3s_version is match('^v[0-9]+\.[0-9]+\.[0-9]+')
    fail_msg: |
      Join cluster mode requires:
      - existing_cluster_apiserver: {{ existing_cluster_apiserver | default('UNDEFINED') }}
      - existing_cluster_token or k3s_token: {{ 'DEFINED' if (existing_cluster_token is defined or k3s_token is defined) else 'UNDEFINED' }}
      - k3s_version: {{ k3s_version | default('UNDEFINED') }}

      Check docs/join-existing-cluster.md for setup instructions
    success_msg: "Join cluster prerequisites validated successfully"

- name: Stop k3s if running
  ansible.builtin.systemd:
    name: k3s
    state: stopped
  failed_when: false

- name: Deploy K3s http_proxy conf
  ansible.builtin.include_tasks: http_proxy.yml
  when: proxy_env is defined

- name: Copy K3s service file
  register: k3s_service
  ansible.builtin.template:
    src: k3s.service.j2
    dest: "{{ systemd_dir }}/k3s.service"
    owner: root
    group: root
    mode: "0644"

- name: Enable and start K3s service
  ansible.builtin.systemd:
    name: k3s
    daemon_reload: true
    state: started
    enabled: true

- name: Wait for node-token
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 300

- name: Verify node joined cluster
  ansible.builtin.command:
    cmd: "{{ k3s_kubectl_binary | default('k3s kubectl') }} get nodes {{ ansible_hostname }}"
  register: node_verify
  until: node_verify.rc == 0
  retries: "{{ retry_count | default(20) }}"
  delay: 10
  changed_when: false

- name: Display success message
  ansible.builtin.debug:
    msg: "Server {{ ansible_hostname }} successfully joined existing cluster at {{ existing_cluster_apiserver }}"

- name: Register node-token file access mode
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server
  register: p

- name: Change file access node-token
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server
    mode: g+rx,o+rx

- name: Read node-token from master
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: node_token
  no_log: true

- name: Store Master node-token
  ansible.builtin.set_fact:
    token: "{{ node_token.content | b64decode | regex_replace('\n', '') }}"
  no_log: true

- name: Restore node-token file access
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server
    mode: "{{ p.stat.mode }}"

- name: Create directory .kube
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.kube"
    state: directory
    owner: "{{ ansible_user_id }}"
    mode: u=rwx,g=rx,o=

- name: Copy config file to user home directory
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ ansible_user_dir }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user_id }}"
    mode: u=rw,g=,o=

- name: Configure kubectl cluster to {{ endpoint_url }}
  ansible.builtin.command: >-
    {{ k3s_kubectl_binary | default('k3s kubectl') }} config set-cluster default
      --server={{ endpoint_url }}
      --kubeconfig {{ ansible_user_dir }}/.kube/config
  changed_when: true
  vars:
    endpoint_url: >-
      https://{{ existing_cluster_apiserver | ansible.utils.ipwrap }}:6443

- name: Create kubectl symlink
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link
  when: k3s_create_kubectl_symlink | default(true) | bool

- name: Create crictl symlink
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/crictl
    state: link
  when: k3s_create_crictl_symlink | default(true) | bool
