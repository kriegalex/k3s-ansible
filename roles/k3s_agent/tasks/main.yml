---
- name: Validate k3s_agent prerequisites
  ansible.builtin.assert:
    that:
      - k3s_version is defined
      - k3s_version is match('^v[0-9]+\.[0-9]+\.[0-9]+')
      - apiserver_endpoint is defined
      - apiserver_endpoint | ansible.utils.ipaddr or apiserver_endpoint | ansible.utils.ipv6
      - k3s_token is defined
      - groups[group_name_master | default('k3s_servers')] | length > 0
    fail_msg: |
      Worker node prerequisites missing:
      - k3s_version: {{ k3s_version | default('UNDEFINED') }}
      - apiserver_endpoint: {{ apiserver_endpoint | default('UNDEFINED') }}
      - k3s_token: {{ 'DEFINED' if k3s_token is defined else 'UNDEFINED' }}
      - k3s_servers group: {{ groups[group_name_master | default('k3s_servers')] | default([]) | length }} servers

      Workers require at least one k3s_server to be defined
    success_msg: "Worker prerequisites validated successfully"

- name: Check for PXE-booted system
  block:
    - name: Check if system is PXE-booted
      ansible.builtin.slurp:
        src: /proc/cmdline
      register: boot_cmdline_raw
      check_mode: false

    - name: Set fact for PXE-booted system
      ansible.builtin.set_fact:
        is_pxe_booted: "{{ 'root=/dev/nfs' in (boot_cmdline_raw.content | b64decode) }}"
      when: boot_cmdline_raw.content is defined

    - name: Include http_proxy configuration tasks
      ansible.builtin.include_tasks: http_proxy.yml

- name: Deploy K3s http_proxy conf
  ansible.builtin.include_tasks: http_proxy.yml
  when: proxy_env is defined

- name: Configure the k3s service
  ansible.builtin.template:
    src: k3s.service.j2
    dest: "{{ systemd_dir }}/k3s-node.service"
    owner: root
    group: root
    mode: "0755"
  notify:
    - Reload systemd
    - Restart k3s-node

- name: Enable k3s-node service
  ansible.builtin.systemd:
    name: k3s-node
    enabled: true

- name: Start k3s-node service
  ansible.builtin.systemd:
    name: k3s-node
    state: started
