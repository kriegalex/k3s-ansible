---
# Handlers for k3s_agent role
# These are triggered by configuration changes to avoid unnecessary service restarts

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart k3s-node
  ansible.builtin.systemd:
    name: k3s-node
    state: restarted
    daemon_reload: true

- name: Enable k3s-node service
  ansible.builtin.systemd:
    name: k3s-node
    enabled: true
