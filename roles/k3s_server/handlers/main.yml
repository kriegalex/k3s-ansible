---
# Handlers for k3s_server role
# These are triggered by configuration changes to avoid unnecessary service restarts

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart k3s
  ansible.builtin.systemd:
    name: k3s
    state: restarted
    daemon_reload: true

- name: Enable k3s service
  ansible.builtin.systemd:
    name: k3s
    enabled: true
