---
- name: Generate JWT secret if not provided
  ansible.builtin.command: openssl rand --hex 16
  register: jwt_secret_result
  when: bluesky_pds_jwt_secret is not defined
  changed_when: false

- name: Set JWT secret from generated value
  ansible.builtin.set_fact:
    bluesky_pds_jwt_secret: "{{ jwt_secret_result.stdout }}"
  when: bluesky_pds_jwt_secret is not defined

- name: Generate PLC rotation key if not provided
  ansible.builtin.shell:
    cmd: >
      set -o pipefail && openssl ecparam --name secp256k1 --genkey --noout --outform DER |
      tail --bytes=+8 |
      head --bytes=32 |
      xxd --plain --cols 32
    executable: /bin/bash
  register: plc_key_result
  when: bluesky_pds_plc_rotation_key_secret is not defined
  changed_when: false

- name: Set PLC rotation key from generated value
  ansible.builtin.set_fact:
    bluesky_pds_plc_rotation_key_secret: "{{ plc_key_result.stdout }}"
  when: bluesky_pds_plc_rotation_key_secret is not defined

- name: Generate admin password if not provided
  ansible.builtin.command: openssl rand --hex 16
  register: admin_password_result
  when: bluesky_pds_admin_password is not defined
  changed_when: false

- name: Set admin password from generated value
  ansible.builtin.set_fact:
    bluesky_pds_admin_password: "{{ admin_password_result.stdout }}"
  when: bluesky_pds_admin_password is not defined

- name: Show generated secrets (development use only)
  ansible.builtin.debug:
    msg:
      - "JWT Secret: {{ bluesky_pds_jwt_secret }}"
      - "PLC Rotation Key: {{ bluesky_pds_plc_rotation_key_secret }}"
      - "Admin Password: {{ bluesky_pds_admin_password }}"
      - "Email SMTP URL: {{ bluesky_pds_email_smtp_url | default('Not generated') }}"
  when: bluesky_pds_show_debug_info | default(false)
