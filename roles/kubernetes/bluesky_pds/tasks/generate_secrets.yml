---
- name: Generate random JWT secret if not provided
  ansible.builtin.set_fact:
    bluesky_pds_jwt_secret: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=32') }}"
    bluesky_pds_jwt_secret_generated: true
  when: bluesky_pds_jwt_secret is not defined or bluesky_pds_jwt_secret == ''

- name: Generate random PLC rotation key secret if not provided
  ansible.builtin.set_fact:
    bluesky_pds_plc_rotation_key_secret: >-
      {{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=32') }}
    bluesky_pds_plc_rotation_key_secret_generated: true
  when: bluesky_pds_plc_rotation_key_secret is not defined or bluesky_pds_plc_rotation_key_secret == ''

- name: Generate random admin password if not provided
  ansible.builtin.set_fact:
    bluesky_pds_admin_password: >-
      {{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits,symbols length=16') }}
    bluesky_pds_admin_password_generated: true
  when: bluesky_pds_admin_password is not defined or bluesky_pds_admin_password == ''

- name: Generate random moderator password if not provided but moderator is enabled
  ansible.builtin.set_fact:
    bluesky_pds_moderator_password: >-
      {{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits,symbols length=16') }}
    bluesky_pds_moderator_password_generated: true
  when: >
    bluesky_pds_moderator_enabled | default(true) and
    bluesky_pds_moderator_handle is defined and
    (bluesky_pds_moderator_password is not defined or bluesky_pds_moderator_password == '')

- name: Display generated secrets warning
  ansible.builtin.debug:
    msg: >
      WARNING: One or more secrets were auto-generated. These are not persisted across playbook runs.
      For production use, set these values explicitly using ansible-vault.
  when: >
    (bluesky_pds_jwt_secret_generated is defined) or
    (bluesky_pds_plc_rotation_key_secret_generated is defined) or
    (bluesky_pds_admin_password_generated is defined) or
    (bluesky_pds_moderator_password_generated is defined)
