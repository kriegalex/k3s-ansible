# roles/k3s-nfs/tasks/main.yml
---
# This role has been refactored to be a utility role.
# For backward compatibility, if nfs_pvc_items is defined, we'll create those PVCs.
- name: Warning about role usage
  ansible.builtin.debug:
    msg: >
      The nfs_pvc role is now a utility role. Please use include_role with tasks_from: create_pvc
      instead of direct inclusion.
  when: nfs_pvc_items is not defined

- name: Include create_pvc task for backward compatibility
  ansible.builtin.include_tasks: create_pvc.yml
  when: nfs_pvc_items is defined
