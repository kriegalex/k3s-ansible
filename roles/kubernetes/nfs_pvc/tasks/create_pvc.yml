---
# This task creates NFS PVs and PVCs as specified by the nfs_pvc_items variable
# Each item in nfs_pvc_items should be a dict with at least:
# - name: The name to use for the PV/PVC
# - namespace: The namespace where the PVC should be created
# - size: The storage size to request

- name: Verify required variable nfs_pvc_items is defined
  ansible.builtin.assert:
    that:
      - nfs_pvc_items is defined
      - nfs_pvc_items | length > 0
    fail_msg: "nfs_pvc_items must be defined as a list of at least one item"

- name: Ensure NFS static StorageClass exists
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'nfs-storageclass.yml.j2') | from_yaml }}"

- name: Create NFS PersistentVolumes
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'persistentvolume.yml.j2') | from_yaml }}"
  with_items: "{{ nfs_pvc_items }}"
  loop_control:
    loop_var: item

- name: Create NFS PersistentVolumeClaims
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'persistentvolumeclaim.yml.j2') | from_yaml }}"
  with_items: "{{ nfs_pvc_items }}"
  loop_control:
    loop_var: item
