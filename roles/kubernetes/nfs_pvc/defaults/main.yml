# roles/k3s-nfs/defaults/main.yml
---
# NFS server configuration
nfs_pvc_server: "{{ nfs_server | default('') }}"
nfs_pvc_root_path: "{{ nfs_root_path | default('/exports') }}"
nfs_version: "4"
nfs_pvc_access_mode: "ReadWriteOnce"
nfs_pvc_reclaim_policy: "Retain"

# Default empty list (should be overridden by calling roles)
nfs_pvc_items: []
