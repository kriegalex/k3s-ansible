# group_vars/ansible_local/paperless.yml
---
# Base
paperless_enabled: false
paperless_namespace: default
paperless_release_name: paperless-ngx
paperless_chart_version: "0.23.0"
paperless_image_tag: "latest"

# Paperless
paperless_admin_user: "admin"
paperless_admin_mail: "admin@example.com"

paperless_app_domain: "{{ paperless_subdomain }}.{{ global_domain_name }}"
paperless_app_timezone: "UTC"
paperless_app_trusted_proxies: "10.42.0.0/16"
paperless_app_filename_format: "{created_year}/{correspondent}/{title}"
paperless_app_consumer_polling: "60"
paperless_app_consumer_recursive: true
paperless_app_consumer_subdirs_as_tags: true
paperless_app_ocr_user_args: '{"invalidate_digital_signatures": true}'

# Persistence
# Use existingClaims or storageClasses
paperless_persistence_media_enabled: true
paperless_media_claim_name: "" # takes precedence over storage class
paperless_media_nfs_claim_name: "nfs-paperless-media" # if set, creates PV/PVC using NFS
paperless_media_nfs_path: "/mnt/user/paperless/media"
paperless_media_storage_size: "100Gi"

paperless_persistence_consume_enabled: true
paperless_consume_claim_name: "" # takes precedence over storage class
paperless_consume_nfs_claim_name: "nfs-paperless-consume" # if set, creates PV/PVC using NFS
paperless_consume_nfs_path: "/mnt/user/paperless/consume"
paperless_consume_storage_size: "10Gi"

paperless_persistence_export_enabled: true
paperless_export_claim_name: "" # takes precedence over storage class
paperless_export_nfs_claim_name: "nfs-paperless-export" # if set, creates PV/PVC using NFS
paperless_export_nfs_path: "/mnt/user/paperless/export"
paperless_export_storage_size: "10Gi"

paperless_persistence_access_mode: "ReadWriteMany"
paperless_nfs_server: 10.0.0.2

# optional, instead of existingClaim
paperless_export_storage_class: ""
paperless_consume_storage_class: ""
paperless_media_storage_class: ""

# PostgreSQL migration settings
paperless_migrate_database: false
paperless_migrate_source_namespace: default
paperless_migrate_source_db_name: paperless-db-old
# If username/password/database are different in source
paperless_migrate_postgresql_user: "{{ paperless_postgresql_user }}"
paperless_migrate_postgresql_name: "{{ paperless_postgresql_name }}"

# Postgresql
paperless_postgresql_storage_class: "longhorn-single-replica"
# internal | cloudnativepg
paperless_postgresql_source: "cloudnativepg"
paperless_postgresql_create_cluster: false
paperless_postgresql_user: paperless
paperless_postgresql_name: paperless
paperless_postgresql_replicas: "{{ groups['k3s_workers'] | length if groups['k3s_workers'] | length > 1 else 1 }}"
paperless_postgresql_override_resources: true
paperless_postgresql_resources_requests_memory: "150Mi"
paperless_postgresql_resources_requests_cpu: "150m"
paperless_postgresql_resources_limits_memory: "500Mi"
paperless_postgresql_resources_limits_cpu: "300m"

# PostgreSQL backup configuration
paperless_postgresql_backup_enabled: false
paperless_postgresql_backup_destination_path: ""
paperless_postgresql_backup_credentials_secret_name: "paperless-s3-backup-credentials"
paperless_postgresql_backup_s3_endpoint: ""
paperless_postgresql_backup_s3_bucket: "paperless-backups"
paperless_postgresql_backup_s3_access_key: ""
paperless_postgresql_backup_s3_secret_key: ""

# Redis
paperless_redis_architecture: "standalone"
paperless_redis_master_count: 1
paperless_redis_password: "{{ vault_paperless_redis_password }}"

# Ingress
paperless_subdomain: "paperless"
paperless_ingress_enabled: true
paperless_ingress_class_name: "{{ global_nginx_class }}"
# allow to override without touching global_cluster_issuer
paperless_ingress_cluster_issuer: "{{ global_cluster_issuer }}"
paperless_ingress_annotations:
  nginx.ingress.kubernetes.io/proxy-body-size: "64m"
  cert-manager.io/cluster-issuer: "{{ paperless_ingress_cluster_issuer }}"

# Resources
paperless_resources_limits_memory: "4Gi"
paperless_resources_limits_cpu: "1000m"
paperless_resources_requests_memory: "1Gi"
paperless_resources_requests_cpu: "100m"

# Affinity
# This settings tries to help paperless/redis/postgresql/collabora stay together
paperless_affinity_enabled: true
paperless_affinity_weight: 60
# This settings tries to help paperless/redis/postgresql/collabora avoid another app
paperless_anti_affinity_enabled: true
paperless_anti_affinity_weight: 50
paperless_anti_affinity_target_name: plex-media-server
paperless_anti_affinity_target_namespace: default
