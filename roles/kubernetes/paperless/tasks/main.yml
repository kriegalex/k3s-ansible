---

- name: Validate PostgreSQL source configuration
  ansible.builtin.assert:
    that:
      - paperless_postgresql_source in ['internal', 'cloudnativepg']
    fail_msg: "Invalid postgresql source '{{ paperless_postgresql_source }}'. \
               Must be one of: internal or cloudnativepg"
    success_msg: "PostgreSQL source '{{ paperless_postgresql_source }}' is valid"

- name: Add paperless helm repository
  kubernetes.core.helm_repository:
    name: gabe565
    repo_url: https://charts.gabe565.com

- name: Create paperless namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ paperless_namespace }}"

# Use nfs_pvc role for all three volume types
- name: Create NFS PV and PVC for Paperless
  ansible.builtin.include_role:
    name: nfs_pvc
    tasks_from: create_pvc
  vars:
    nfs_pvc_items:
      - name: "{{ paperless_media_nfs_claim_name }}"
        namespace: "{{ paperless_namespace }}"
        size: "{{ paperless_media_storage_size | default('100Gi') }}"
        description: "Paperless media storage"
        access_mode: "{{ paperless_persistence_access_mode }}"
        server: "{{ paperless_nfs_server }}"
        path: "{{ paperless_media_nfs_path }}"
      - name: "{{ paperless_consume_nfs_claim_name }}"
        namespace: "{{ paperless_namespace }}"
        size: "{{ paperless_consume_storage_size | default('10Gi') }}"
        description: "Paperless consume directory"
        access_mode: "{{ paperless_persistence_access_mode }}"
        server: "{{ paperless_nfs_server }}"
        path: "{{ paperless_consume_nfs_path }}"
      - name: "{{ paperless_export_nfs_claim_name }}"
        namespace: "{{ paperless_namespace }}"
        size: "{{ paperless_export_storage_size | default('10Gi') }}"
        description: "Paperless export directory"
        access_mode: "{{ paperless_persistence_access_mode }}"
        server: "{{ paperless_nfs_server }}"
        path: "{{ paperless_export_nfs_path }}"
  when: >
    (paperless_persistence_media_enabled and paperless_media_nfs_claim_name | length > 0) or
    (paperless_persistence_consume_enabled and paperless_consume_nfs_claim_name | length > 0) or
    (paperless_persistence_export_enabled and paperless_export_nfs_claim_name | length > 0)

- name: Set persistence claim name based on NFS claim if provided
  ansible.builtin.set_fact:
    paperless_media_claim_name: "{{ paperless_media_nfs_claim_name }}"
  when: paperless_persistence_media_enabled and paperless_media_nfs_claim_name | length > 0

- name: Set persistence claim name based on NFS claim if provided
  ansible.builtin.set_fact:
    paperless_consume_claim_name: "{{ paperless_consume_nfs_claim_name }}"
  when: paperless_persistence_consume_enabled and paperless_consume_nfs_claim_name | length > 0

- name: Set persistence claim name based on NFS claim if provided
  ansible.builtin.set_fact:
    paperless_export_claim_name: "{{ paperless_export_nfs_claim_name }}"
  when: paperless_persistence_export_enabled and paperless_export_nfs_claim_name | length > 0

- name: Install CloudNativePG
  ansible.builtin.include_role:
    name: cloudnative_pg
  when:
    - paperless_postgresql_source == "cloudnativepg"
    - not cloudnative_pg_enabled

- name: Configure CloudNativePG
  ansible.builtin.import_tasks: cloudnative_pg.yml
  when:
    - paperless_postgresql_source == "cloudnativepg"
    - paperless_postgresql_create_cluster

# Remove the legacy NFS resources task since we're using nfs_pvc consistently now

# - name: Generate debug YAML file
#   ansible.builtin.template:
#     src: templates/values.yaml.j2
#     dest: /tmp/paperless_values_debug.yaml
#     mode: '0644'
#   diff: true  # This will show the difference in the output

- name: Deploy Paperless using Helm
  kubernetes.core.helm:
    name: "{{ paperless_release_name }}"
    chart_ref: gabe565/paperless-ngx
    chart_version: "{{ paperless_chart_version }}"
    release_namespace: "{{ paperless_namespace }}"
    values: "{{ lookup('template', 'values.yaml.j2') | from_yaml }}"
    create_namespace: true
    update_repo_cache: true
    force: false
    wait: true
