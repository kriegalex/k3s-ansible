---

- name: Validate PostgreSQL source configuration
  ansible.builtin.assert:
    that:
      - nextcloud_postgresql_source in ['internal', 'external', 'cloudnativepg']
    fail_msg: "Invalid postgresql source '{{ nextcloud_postgresql_source }}'. \
               Must be one of: internal, external, or cloudnativepg"
    success_msg: "PostgreSQL source '{{ nextcloud_postgresql_source }}' is valid"

- name: Validate persistence configuration
  ansible.builtin.assert:
    that: >-
      not (nextcloud_persistence_existing_claim | default('') | length > 0 and
           nextcloud_persistence_storage_class | default('') | length > 0)
    fail_msg: "You can't specify both nextcloud_persistence_existing_claim and nextcloud_persistence_storage_class"
    success_msg: "Persistence configuration is valid"

- name: Add nextcloud Helm repository
  kubernetes.core.helm_repository:
    name: "nextcloud"
    url: "https://nextcloud.github.io/helm/"
    state: present

- name: Create nextcloud namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ nextcloud_namespace }}"

# Use nfs_pvc role for data storage
- name: Create NFS PV and PVC for Nextcloud
  ansible.builtin.include_role:
    name: nfs_pvc
    tasks_from: create_pvc
  vars:
    nfs_pvc_items:
      - name: "{{ nextcloud_persistence_data_nfs_claim_name }}"
        namespace: "{{ nextcloud_namespace }}"
        size: "{{ nextcloud_persistence_data_size }}"
        description: "Nextcloud data storage"
        access_mode: "{{ nextcloud_persistence_data_access_mode }}"
        reclaim_policy: "{{ nextcloud_persistence_data_nfs_reclaim_policy }}"
        server: "{{ nextcloud_persistence_data_nfs_server }}"
        path: "{{ nextcloud_persistence_data_nfs_path }}"
  when:
    - nextcloud_persistence_data_enabled | bool
    - nextcloud_persistence_data_nfs_claim_name | length > 0

- name: Set persistence claim name based on NFS claim if provided
  ansible.builtin.set_fact:
    nextcloud_persistence_data_existing_claim: "{{ nextcloud_persistence_data_nfs_claim_name }}"
  when: nextcloud_persistence_data_nfs_claim_name | length > 0

- name: Install CloudNativePG
  ansible.builtin.include_role:
    name: cloudnative_pg
  when:
    - nextcloud_postgresql_source == "cloudnativepg"
    - not cloudnative_pg_enabled

- name: Configure CloudNativePG
  ansible.builtin.import_tasks: cloudnative_pg.yml
  when:
    - nextcloud_postgresql_source == "cloudnativepg"
    - nextcloud_postgresql_create_cluster

# - name: Debug template
#   ansible.builtin.debug:
#     msg: "{{ lookup('template', 'values.yaml.j2') }}"

- name: Deploy nextcloud loaded from template (helm)
  kubernetes.core.helm:
    name: "{{ nextcloud_release_name }}"
    chart_ref: nextcloud/nextcloud
    chart_version: "{{ nextcloud_chart_version }}"
    release_namespace: "{{ nextcloud_namespace }}"
    create_namespace: true
    update_repo_cache: true
    values: "{{ lookup('template', 'values.yaml.j2') | from_yaml }}"
    wait: true

- name: Execute post helm steps
  when: nextcloud_replica_count > 0 and nextcloud_first_install
  block:
    - name: Get nextcloud pod name
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ nextcloud_namespace }}"
        label_selectors:
          - app.kubernetes.io/name = nextcloud
      register: pod_list

    - name: Adding additional fs_storage_path_prefix index to the oc_filecache table
      kubernetes.core.k8s_exec:
        namespace: "{{ nextcloud_namespace }}"
        pod: "{{ pod_list.resources[0].metadata.name }}"
        command: su -s /bin/sh www-data -c "php occ db:add-missing-indices"
      register: occ_add_missing_indices_status
      when: nextcloud_postgresql_create_cluster or (nextcloud_postgresql_source != "cloudnativepg")

    - name: Print occ command result
      ansible.builtin.debug:
        msg: "{{ occ_add_missing_indices_status.stdout }}"
      when: occ_add_missing_indices_status.stdout is defined

    - name: Set maintenance window for Nextcloud
      kubernetes.core.k8s_exec:
        namespace: "{{ nextcloud_namespace }}"
        pod: "{{ pod_list.resources[0].metadata.name }}"
        command: su -s /bin/sh www-data -c "php occ config:system:set maintenance_window_start --value=\"1\" --type=integer"
      register: occ_maintenance_window_start
      when: nextcloud_postgresql_create_cluster or (nextcloud_postgresql_source != "cloudnativepg")

    - name: Print occ command result
      ansible.builtin.debug:
        msg: "{{ occ_maintenance_window_start.stdout }}"
      when: occ_maintenance_window_start.stdout is defined
