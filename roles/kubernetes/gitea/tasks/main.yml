---
- name: Add Gitea Helm repository
  kubernetes.core.helm_repository:
    name: "gitea-charts"
    url: "https://dl.gitea.com/charts/"
    state: present

# - name: Generate debug values YAML file
#   ansible.builtin.template:
#     src: templates/values.yml.j2
#     dest: /tmp/gitea_values_debug.yaml
#     mode: '0644'
#   diff: true  # This will show the difference in the output
#
# - name: Generate debug secret YAML file
#   ansible.builtin.template:
#     src: templates/gitea-admin-secret.yml.j2
#     dest: /tmp/gitea_secret_debug.yaml
#     mode: '0644'
#   diff: true  # This will show the difference in the output

- name: Create Gitea namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gitea_namespace }}"

- name: Create NFS PV and PVC for Gitea
  ansible.builtin.include_role:
    name: nfs_pvc
    tasks_from: create_pvc
  vars:
    nfs_pvc_items:
      - name: "{{ gitea_persistence_nfs_claim_name }}"
        namespace: "{{ gitea_namespace }}"
        size: "{{ gitea_persistence_size }}"
        description: "Gitea repositories and config"
        access_mode: "{{ gitea_persistence_access_mode }}"
        reclaim_policy: "{{ gitea_persistence_nfs_reclaim_policy }}"
        server: "{{ gitea_persistence_nfs_server }}"
        # Let nfs_pvc calculate the path with its own defaults if path isn't explicitly set
        path: "{{ gitea_persistence_nfs_path }}"
  when: gitea_persistence_nfs_claim_name | length > 0

- name: Set persistence claim name based on NFS claim if provided
  ansible.builtin.set_fact:
    gitea_persistence_claim_name: "{{ gitea_persistence_nfs_claim_name }}"
  when: gitea_persistence_nfs_claim_name | length > 0

- name: Create Gitea admin secret
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'gitea-admin-secret.yml.j2') | from_yaml }}"

- name: Install CloudNativePG
  ansible.builtin.include_role:
    name: cloudnative_pg
  when:
    - gitea_postgresql_source == "cloudnativepg"
    - not cloudnative_pg_enabled

- name: Configure CloudNativePG
  ansible.builtin.import_tasks: cloudnative_pg.yml
  when:
    - gitea_postgresql_source == "cloudnativepg"
    - gitea_postgresql_create_cluster

- name: Deploy Gitea Helm Chart
  kubernetes.core.helm:
    name: "{{ gitea_release_name }}"
    chart_ref: gitea-charts/gitea
    chart_version: "{{ gitea_chart_version }}"
    release_namespace: "{{ gitea_namespace }}"
    create_namespace: false
    update_repo_cache: true
    force: false
    values: "{{ lookup('template', 'values.yml.j2') | from_yaml }}"
    wait: true
