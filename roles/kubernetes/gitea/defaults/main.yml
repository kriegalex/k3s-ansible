# defaults/main.yml
---
gitea_enabled: false
gitea_namespace: "default"
gitea_release_name: "gitea"
gitea_chart_version: "10.6.0"
# Image configuration
gitea_image_registry: ""
gitea_image_repository: "gitea/gitea"
# -rootless suffix is added by the helm chart if using rootless: true
gitea_image_tag: "latest"
gitea_image_pull_policy: "IfNotPresent"
gitea_image_rootless: true

# SSH Service configuration
gitea_service_ssh_type: "LoadBalancer"
gitea_service_ssh_port: 8022
gitea_service_ssh_traffic_policy: "Local"

# Ingress configuration
gitea_ingress_enabled: true
gitea_ingress_class_name: "{{ global_nginx_class }}"
gitea_ingress_cert_issuer: "{{ global_cluster_issuer }}"
gitea_ingress_subdomain: "git"
gitea_ingress_hostname: "{{ gitea_ingress_subdomain }}.{{ global_domain_name }}"
gitea_ingress_tls_secret_name: "gitea-tls"

# Persistence configuration
gitea_persistence_enabled: true
gitea_persistence_create: false # true if using storageClass
gitea_persistence_mount: true
gitea_persistence_claim_name: "" # takes precedence over storage class
gitea_persistence_nfs_claim_name: "nfs-gitea" # if set, creates PV/PVC using NFS
gitea_persistence_storage_class: "" # optional
gitea_persistence_size: "1Ti" # size for PVC/PV
gitea_persistence_access_mode: "ReadWriteMany"
# For NFS integration - these defaults will use the values from nfs_pvc role if not overridden
gitea_persistence_nfs_server: "10.0.0.2"
# Only construct path when claim name is provided to avoid errors
gitea_persistence_nfs_path: "/mnt/user/gitea"
gitea_persistence_nfs_reclaim_policy: "Retain"

# Gitea admin configuration
gitea_admin_secret_name: "gitea-admin-credentials"
gitea_admin_username: "admin"
gitea_admin_email: "admin@example.com"
gitea_admin_password: "{{ vault_gitea_admin_password }}"

# Redis configuration
gitea_redis_cluster_enabled: false
gitea_redis_enabled: true
gitea_redis_architecture: "standalone"
gitea_redis_password: "{{ vault_gitea_redis_password }}"
gitea_redis_master_count: 1
gitea_redis_storage_class: "longhorn-single-replica" # fast cache

# PostgreSQL configuration
gitea_postgresql_ha_enabled: false
# internal | cloudnativepg
# controls postgresql.enabled in the chart
gitea_postgresql_source: cloudnativepg
gitea_postgresql_create_cluster: true
gitea_postgresql_username: "gitea"
gitea_postgresql_database: "gitea"
gitea_postgresql_password: "{{ vault_gitea_db_password }}"
gitea_postgresql_port: 5432
# use single replica for cloudnativepg, normal for internal
gitea_postgresql_storage_class: "longhorn-single-replica"
gitea_postgresql_storage_size: "10Gi" # used for cloudnativepg
gitea_postgresql_instances: "{{ groups['k3s_workers'] | length if groups['k3s_workers'] | length > 1 else 1 }}"
gitea_postgresql_override_resources: true
gitea_postgresql_resources_requests_memory: "256Mi"
gitea_postgresql_resources_requests_cpu: "150m"
gitea_postgresql_resources_limits_memory: "500Mi"
gitea_postgresql_resources_limits_cpu: "300m"

# PostgreSQL backup configuration
gitea_postgresql_backup_enabled: false
gitea_postgresql_backup_destination_path: ""
gitea_postgresql_backup_credentials_secret_name: "gitea-s3-backup-credentials"
gitea_postgresql_backup_s3_endpoint: ""
gitea_postgresql_backup_s3_bucket: "gitea-backups"
gitea_postgresql_backup_s3_access_key: ""
gitea_postgresql_backup_s3_secret_key: ""

# Resources
gitea_resources_limits_memory: "1Gi"
gitea_resources_limits_cpu: "1000m"
gitea_resources_requests_memory: "256Mi"
gitea_resources_requests_cpu: "100m"

# Affinity
# This settings tries to help gitea/redis/postgresql/collabora stay together
gitea_affinity_enabled: true
gitea_affinity_weight: 60
# This settings tries to help gitea/redis/postgresql/collabora avoid another app
gitea_anti_affinity_enabled: true
gitea_anti_affinity_weight: 50
gitea_anti_affinity_target_name: plex-media-server

# Database migration settings
gitea_migrate_database: false
gitea_migrate_source_namespace: "default"
gitea_migrate_source_db_name: "gitea-db"
gitea_migrate_postgresql_username: "{{ gitea_postgresql_username }}"
gitea_migrate_postgresql_database: "{{ gitea_postgresql_database }}"
