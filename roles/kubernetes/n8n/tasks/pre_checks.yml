---
- name: Ensure Helm is installed
  ansible.builtin.command: helm version
  register: helm_version
  changed_when: false
  failed_when: false

- name: Fail if Helm is not installed
  ansible.builtin.fail:
    msg: "Helm is not installed. Please install Helm before running this role."
  when: helm_version.rc != 0

- name: Ensure kubectl is installed
  ansible.builtin.command: kubectl version --client
  register: kubectl_version
  changed_when: false
  failed_when: false

- name: Fail if kubectl is not installed
  ansible.builtin.fail:
    msg: "kubectl is not installed. Please install kubectl before running this role."
  when: kubectl_version.rc != 0

- name: Verify Kubernetes connectivity
  kubernetes.core.k8s_info:
    kind: Node
  register: node_info
  failed_when: false

- name: Fail if cannot connect to Kubernetes
  ansible.builtin.fail:
    msg: "Cannot connect to Kubernetes cluster. Please check your kubeconfig."
  when: node_info.failed | default(false)

- name: Check if namespace exists
  kubernetes.core.k8s_info:
    kind: Namespace
    name: "{{ n8n_namespace }}"
  register: namespace_check

- name: Create namespace if it doesn't exist and creation is enabled
  kubernetes.core.k8s:
    state: present
    kind: Namespace
    name: "{{ n8n_namespace }}"
  when:
    - namespace_check.resources | length == 0
    - n8n_create_namespace
