---
- name: Get n8n pod status
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ n8n_namespace }}"
    label_selectors:
      - "app.kubernetes.io/instance={{ n8n_helm_release_name }}"
  register: pod_status

- name: Display n8n pod status
  ansible.builtin.debug:
    msg: "{{ item.metadata.name }} is {{ item.status.phase }}"
  loop: "{{ pod_status.resources }}"

- name: Get n8n service information
  kubernetes.core.k8s_info:
    kind: Service
    namespace: "{{ n8n_namespace }}"
    label_selectors:
      - "app.kubernetes.io/instance={{ n8n_helm_release_name }}"
  register: svc_status

- name: Display n8n service information
  ansible.builtin.debug:
    msg: >-
      Service {{ item.metadata.name }} - 
      Type: {{ item.spec.type }}, 
      Ports: {{ item.spec.ports | map(attribute='port') | list }}
  loop: "{{ svc_status.resources }}"
  when: svc_status.resources | length > 0
