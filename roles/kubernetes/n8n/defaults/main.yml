---
# N8N Helm Chart Configuration

# Helm configuration
n8n_helm_chart_name: "n8n"
n8n_helm_repo_name: "community-charts"
n8n_helm_repo_url: "https://community-charts.github.io/helm-charts"
n8n_helm_chart_version: "1.3.5"  # As per documentation
n8n_helm_release_name: "n8n"
n8n_namespace: "n8n"
n8n_create_namespace: true

# Default configurations
n8n_log_level: "info"
n8n_timezone: "UTC"

# Database configuration
n8n_db_type: "sqlite"  # Options: sqlite, postgresdb
n8n_table_prefix: ""

# PostgreSQL configuration (if using postgresdb)
n8n_use_external_postgresql: false
n8n_postgresql_enabled: false  # Will use Bitnami's PostgresSQL if true and n8n_use_external_postgresql is false
n8n_external_postgresql:
  host: ""
  port: 5432
  username: "postgres"
  password: ""
  database: "n8n"
  existing_secret: ""  # Name of existing K8s secret with PostgreSQL credentials

# Redis configuration (needed for queue mode)
n8n_use_external_redis: false
n8n_redis_enabled: false  # Will use Bitnami's Redis if true and n8n_use_external_redis is false
n8n_external_redis:
  host: ""
  port: 6379
  username: ""
  password: ""
  existing_secret: ""  # Name of existing K8s secret with Redis credentials

# Worker configuration
n8n_worker_mode: "regular"  # Options: regular, queue
n8n_worker_concurrency: 10
n8n_worker_count: 2
n8n_worker_autoscaling_enabled: false
n8n_worker_resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "512m"
    memory: "512Mi"

# Webhook configuration
n8n_webhook_mode: "regular"  # Options: regular, queue
n8n_webhook_url: ""
n8n_webhook_count: 2
n8n_webhook_autoscaling_enabled: false
n8n_webhook_resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "512m"
    memory: "512Mi"

# Main node configuration
n8n_main_count: 1
n8n_main_resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "512m"
    memory: "512Mi"

# Ingress configuration
n8n_ingress_enabled: false
n8n_ingress_host: ""
n8n_ingress_path: "/"
n8n_ingress_path_type: "Prefix"
n8n_ingress_annotations: {}
n8n_ingress_tls_enabled: false
n8n_ingress_tls_secret_name: ""

# Encryption key
n8n_encryption_key: ""  # If empty, it will be auto-generated
n8n_existing_encryption_key_secret: ""  # Name of existing K8s secret with encryption key

# Additional configuration
n8n_workflow_history_enabled: true
n8n_workflow_history_prune_time: 336  # Time in hours to keep workflow history
n8n_grace_shutdown_timeout: 30
n8n_api_enabled: true

# Customize values.yaml
n8n_custom_values: {}
