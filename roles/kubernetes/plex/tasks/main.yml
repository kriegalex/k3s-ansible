# roles/plex/tasks/main.yml
---
- name: Input validation
  ansible.builtin.import_tasks: validation.yml

- name: Install Intel GPU plugin dependency
  ansible.builtin.include_role:
    name: intel_gpu_plugin
  when: plex_intel_hw_accel and not intel_gpu_plugin_enabled

- name: Add Plex Helm repository
  kubernetes.core.helm_repository:
    name: plex
    repo_url: "{{ plex_chart_repo }}"
    state: present

- name: Create namespace if needed
  kubernetes.core.k8s:
    name: "{{ plex_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Create NFS PV and PVC for media volumes
  ansible.builtin.include_role:
    name: nfs_pvc
    tasks_from: create_pvc
  when: nfs_pvc_items | length > 0
  vars:
    nfs_pvc_items: >-
      {{ plex_media_volumes |
        selectattr('nfs.enabled', 'defined') |
        selectattr('nfs.enabled') |
        map('combine', {'__tmp_namespace': plex_namespace}) |
        map('json_query', '{
          name: claim_name,
          namespace: __tmp_namespace,
          server: nfs.server,
          path: nfs.path,
          size: nfs.size,
          access_mode: nfs.access_mode,
          reclaim_policy: nfs.reclaim_policy
          }') |
        list }}

- name: Deploy Plex using Helm
  kubernetes.core.helm:
    name: "{{ plex_release_name }}"
    chart_ref: "plex/{{ plex_chart_name }}"
    chart_version: "{{ plex_chart_version }}"
    release_namespace: "{{ plex_namespace }}"
    create_namespace: false
    update_repo_cache: true
    force: false
    values: "{{ lookup('template', 'values.yaml.j2') | from_yaml }}"
    wait: true
