---
- name: Verify NFS configuration for media volumes
  ansible.builtin.assert:
    that:
      - >-
        item.nfs is not defined or
        not item.nfs.enabled or
        (item.nfs.server is defined and item.nfs.server | length > 0 and
         item.nfs.path is defined and item.nfs.path | length > 0)
    fail_msg: >-
      For media volume "{{ item.name }}":
      - When using NFS (nfs.enabled: true), you must specify nfs.server and nfs.path
    quiet: true
  loop: "{{ plex_media_volumes }}"
  when: plex_media_volumes | length > 0
