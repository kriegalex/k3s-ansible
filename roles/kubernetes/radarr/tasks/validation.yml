---
- name: Verify persistence configuration when enabled
  ansible.builtin.assert:
    that:
      - >-
        not radarr_persistence_enabled or
        (radarr_existing_claim is defined) or
        (radarr_storage_class and radarr_storage_size)
      - >-
        not radarr_persistence_enabled or
        not ((radarr_existing_claim is defined and radarr_existing_claim | length > 0) and
             (radarr_storage_class is defined and radarr_storage_class | length > 0))
    fail_msg: >-
      When persistence is enabled, either:
      - Define an existing claim using radarr_existing_claim
      - OR define both radarr_storage_class and radarr_storage_size
      But not both options simultaneously.

- name: Verify storage size format when defined
  ansible.builtin.assert:
    that:
      - >-
        not radarr_persistence_enabled or
        radarr_existing_claim is defined or
        radarr_storage_size | regex_search('^[0-9]+[MGT]i$')
    fail_msg: "Invalid storage size format. Must be in format: 1Gi, 100Mi, 2Ti, etc."

- name: Verify NFS configuration for additional volumes
  ansible.builtin.assert:
    that:
      - >-
        item.nfs is not defined or
        not item.nfs.enabled or
        (item.nfs.server is defined and item.nfs.server | length > 0 and
         item.nfs.path is defined and item.nfs.path | length > 0)
    fail_msg: >-
      For additional volume "{{ item.name }}":
      - When using NFS (nfs.enabled: true), you must specify nfs.server and nfs.path
    quiet: true
  loop: "{{ radarr_additional_volumes }}"
