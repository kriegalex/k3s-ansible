---
# This playbook joins new nodes (servers or workers) to an existing k3s cluster
#
# IMPORTANT: This playbook does NOT create a new cluster. It adds nodes to an existing one.
#
# Required variables:
#   - existing_cluster_apiserver: VIP or IP of the existing cluster's API server
#   - existing_cluster_token: K3s token from the existing cluster (optional, falls back to k3s_token)
#
# Usage:
#   # Join new server nodes
#   ansible-playbook playbooks/join_cluster.yml -i inventory/hosts.yml --limit new_server_hostname
#
#   # Join new worker nodes
#   ansible-playbook playbooks/join_cluster.yml -i inventory/hosts.yml --limit new_worker_hostname

- name: Validate prerequisites for joining existing cluster
  hosts: k3s_cluster
  gather_facts: false
  tasks:
    - name: Check required variables
      ansible.builtin.assert:
        that:
          - existing_cluster_apiserver is defined
          - existing_cluster_apiserver | length > 0
          - (existing_cluster_token is defined and existing_cluster_token | length > 0) or
            (k3s_token is defined and k3s_token | length > 0)
        fail_msg: |
          Missing required variables for joining existing cluster.

          Required variables:
            - existing_cluster_apiserver: {{ existing_cluster_apiserver | default('NOT DEFINED') }}
            - existing_cluster_token: {{ 'DEFINED' if existing_cluster_token is defined else 'NOT DEFINED (will use k3s_token)' }}
            - k3s_token: {{ 'DEFINED' if k3s_token is defined else 'NOT DEFINED' }}

          Please set these variables in your inventory before running this playbook.

          Example (group_vars/all/vars.yml):
            existing_cluster_apiserver: "192.168.1.100"

          Example (group_vars/all/vault.yml):
            existing_cluster_token: "K1234567890abcdef::server:abcdef1234567890"

          Or use the existing k3s_token if the cluster was created with this Ansible setup.
        success_msg: "Prerequisites validated successfully"

    - name: Display join configuration
      ansible.builtin.debug:
        msg:
          - "Joining nodes to existing cluster:"
          - "  API Server: {{ existing_cluster_apiserver }}"
          - "  Token: {{ 'Using existing_cluster_token' if existing_cluster_token is defined else 'Using k3s_token' }}"
          - "  Servers to join: {{ groups['k3s_servers'] | intersect(ansible_play_hosts) | length }}"
          - "  Workers to join: {{ groups['k3s_workers'] | intersect(ansible_play_hosts) | length }}"

- name: Prepare nodes for joining cluster
  hosts: k3s_cluster
  gather_facts: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: prereq
      become: true
    - role: download
      become: true
    - role: raspberrypi
      become: true
      when: ansible_facts.architecture is search('arm|aarch')
    - role: k3s_custom_registries
      become: true
      when: custom_registries | default(false)

- name: Join server nodes to existing cluster
  hosts: k3s_servers
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: k3s_server_join
      become: true

- name: Join worker nodes to existing cluster
  hosts: k3s_workers
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: k3s_agent
      become: true

- name: Fetch kubeconfig from first server
  hosts: k3s_servers[0]
  roles:
    - role: fetch
      become: true

- name: Verify nodes joined successfully
  hosts: ansible_local
  connection: local
  gather_facts: false
  tasks:
    - name: Wait for newly joined nodes to be ready
      ansible.builtin.command:
        cmd: kubectl get nodes -o wide
      register: kubectl_nodes
      retries: 10
      delay: 6
      until: kubectl_nodes.rc == 0
      changed_when: false

    - name: Display cluster nodes
      ansible.builtin.debug:
        msg: "{{ kubectl_nodes.stdout_lines }}"

    - name: Get node count
      ansible.builtin.command:
        cmd: kubectl get nodes --no-headers | wc -l
      register: node_count
      changed_when: false

    - name: Display success message
      ansible.builtin.debug:
        msg:
          - "Successfully joined nodes to existing cluster!"
          - "Total cluster nodes: {{ node_count.stdout }}"
          - ""
          - "Next steps:"
          - "  1. Verify all nodes are Ready: kubectl get nodes"
          - "  2. Check for any issues: kubectl get events --all-namespaces"
          - "  3. Label new nodes if needed: kubectl label node <name> node-role.kubernetes.io/worker=worker"
