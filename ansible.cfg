[defaults]
inventory = ./inventory.yml
roles_path = ./k3s-io-ansible/roles
collections_path = ./collections
; Requires .vault_pass to exist (see README "Vault") — a missing file errors every run
vault_password_file = .vault_pass
stdout_callback = ansible.builtin.default
result_format = yaml
deprecation_warnings = True

[ssh_connection]
pipelining = True
