---
name: Fork Maintenance

# This workflow checks fork-specific features and monitors upstream divergence
# It complements the existing CI workflows with fork-specific validations

on:
  push:
    branches: [main, remove-helm-apps]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 00:00 UTC to monitor upstream
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual triggering

jobs:
  upstream-divergence:
    name: Monitor Upstream Divergence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for comparison

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/timothystewart6/k3s-ansible.git || true
          git fetch upstream

      - name: Calculate divergence
        id: divergence
        run: |
          BEHIND=$(git rev-list HEAD..upstream/master --count)
          AHEAD=$(git rev-list upstream/master..HEAD --count)

          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT

          echo "📊 Divergence Status:"
          echo "  - Commits behind upstream: $BEHIND"
          echo "  - Commits ahead of upstream: $AHEAD"

      - name: Show recent upstream commits
        if: steps.divergence.outputs.behind > 0
        run: |
          echo "📝 Recent upstream commits we're missing (last 10):"
          git log HEAD..upstream/master --oneline --no-merges -10

      - name: Check for security-related commits
        if: steps.divergence.outputs.behind > 0
        run: |
          SECURITY=$(git log HEAD..upstream/master --grep="security\|CVE\|vulnerability" --oneline || true)
          if [ -n "$SECURITY" ]; then
            echo "::warning::⚠️  Potential security fixes in upstream:"
            echo "$SECURITY"
          else
            echo "✅ No obvious security commits in upstream"
          fi

      - name: Evaluate divergence level
        run: |
          BEHIND=${{ steps.divergence.outputs.behind }}

          if [ $BEHIND -gt 50 ]; then
            echo "::warning::Fork is significantly behind upstream ($BEHIND commits). Quarterly sync recommended."
            echo "See docs/upstream-sync-process.md for sync instructions."
          elif [ $BEHIND -gt 20 ]; then
            echo "::notice::Fork is $BEHIND commits behind upstream. Consider syncing soon."
          else
            echo "✅ Fork divergence is within acceptable range ($BEHIND commits)"
          fi

  check-fork-features:
    name: Verify Fork-Specific Features
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check join cluster feature
        run: |
          echo "::group::Checking join cluster feature"

          # Verify role exists
          if [ ! -d "roles/k3s_server_join" ]; then
            echo "::error::❌ Join cluster role missing!"
            exit 1
          fi

          # Verify playbook exists
          if [ ! -f "join_cluster.yml" ]; then
            echo "::error::❌ Join cluster playbook missing!"
            exit 1
          fi

          echo "::notice::Join cluster documentation is in CLAUDE.md and README.md"

          echo "✅ Join cluster feature intact"
          echo "::endgroup::"

      - name: Check YAML inventory format
        run: |
          echo "::group::Checking YAML inventory format"

          # Verify YAML inventory exists (alternative file is the actual YAML format)
          if [ ! -f "inventory/sample/hosts.yml.alternative" ]; then
            echo "::error::❌ YAML inventory missing!"
            exit 1
          fi

          # Check if INI inventory exists (primary format supported)
          if [ -f "inventory/sample/hosts.ini" ]; then
            echo "✅ Both INI and YAML inventory formats available"
          fi

          echo "✅ YAML inventory format preserved"
          echo "::endgroup::"

      - name: Check vault configuration
        run: |
          echo "::group::Checking vault configuration"

          # Verify ansible.cfg has vault settings
          if ! grep -q "vault_password_file" ansible.cfg; then
            echo "::error::❌ vault_password_file missing from ansible.cfg!"
            exit 1
          fi

          # Verify vault sample file exists
          if [ ! -f "inventory/sample/group_vars/all/vault.yml" ]; then
            echo "::warning::Vault sample file missing"
          fi

          echo "✅ Vault configuration preserved"
          echo "::endgroup::"

      - name: Check directory structure
        run: |
          echo "::group::Checking organized directory structure"

          # Verify role structure
          REQUIRED_ROLES=(
            "roles/k3s_server"
            "roles/k3s_agent"
            "roles/k3s_server_join"
            "roles/prereq"
            "roles/download"
            "roles/k3s_server_post"
            "roles/reset"
          )

          for role in "${REQUIRED_ROLES[@]}"; do
            if [ ! -d "$role" ]; then
              echo "::error::❌ Required role missing: $role"
              exit 1
            fi
          done

          echo "✅ Required roles present"
          echo "::endgroup::"

  check-phase1-improvements:
    name: Verify Phase 1 Quality Improvements
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for deprecated loop syntax
        run: |
          echo "::group::Checking for deprecated with_items syntax"

          DEPRECATED=$(grep -r "with_items:" roles/ --include="*.yml" --exclude-dir=.git || true)

          if [ -n "$DEPRECATED" ]; then
            echo "::error::❌ Deprecated 'with_items' syntax detected (Phase 1 regression)!"
            echo "$DEPRECATED"
            exit 1
          fi

          echo "✅ No deprecated loop syntax found"
          echo "::endgroup::"

      - name: Check validation tasks exist
        run: |
          echo "::group::Checking validation tasks"

          # Check k3s_server validation
          if ! grep -q "Validate k3s_server prerequisites" roles/k3s_server/tasks/main.yml; then
            echo "::error::❌ k3s_server validation missing (Phase 1 regression)!"
            exit 1
          fi

          # Check k3s_server_join validation
          if ! grep -q "Validate join cluster prerequisites" roles/k3s_server_join/tasks/main.yml; then
            echo "::error::❌ k3s_server_join validation missing (Phase 1 regression)!"
            exit 1
          fi

          # Check k3s_agent validation
          if ! grep -q "Validate k3s_agent prerequisites" roles/k3s_agent/tasks/main.yml; then
            echo "::error::❌ k3s_agent validation missing (Phase 1 regression)!"
            exit 1
          fi

          echo "✅ All validation tasks present"
          echo "::endgroup::"

      - name: Check idempotency improvements
        run: |
          echo "::group::Checking idempotency improvements"

          # Check that key idempotency fixes are still in place

          # 1. k3s_server should check status before reset-failed
          if ! grep -q "Check k3s-init service status" roles/k3s_server/tasks/main.yml; then
            echo "::warning::k3s_server reset-failed idempotency check missing"
          fi

          # 2. metallb should detect changes in kubectl apply
          if grep -q "changed_when: false" roles/k3s_server_post/tasks/metallb.yml | grep -q "Apply metallb CRs"; then
            echo "::warning::metallb Apply CRs may have improper changed_when suppression"
          fi

          # 3. Agent should use slurp instead of cat
          if ! grep -q "ansible.builtin.slurp" roles/k3s_agent/tasks/main.yml; then
            echo "::warning::k3s_agent should use slurp for reading /proc/cmdline"
          fi

          # 4. Raspberrypi should use slurp instead of grep
          if ! grep -q "ansible.builtin.slurp" roles/raspberrypi/tasks/main.yml; then
            echo "::warning::raspberrypi should use slurp for hardware detection"
          fi

          echo "✅ Idempotency improvements verified"
          echo "::endgroup::"

  validate-inventory-structure:
    name: Validate YAML Inventory Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate YAML syntax
        run: |
          python -c "import yaml; yaml.safe_load(open('inventory/sample/hosts.yml.alternative'))"
          echo "✅ Sample inventory is valid YAML"

      - name: Validate inventory groups
        run: |
          python -c "
          import yaml
          with open('inventory/sample/hosts.yml.alternative') as f:
              inv = yaml.safe_load(f)

          # Check required groups exist
          assert 'k3s_servers' in inv, 'Missing k3s_servers group'
          assert 'k3s_workers' in inv, 'Missing k3s_workers group'
          assert 'k3s_cluster' in inv, 'Missing k3s_cluster group'
          assert 'ansible_local' in inv, 'Missing ansible_local group'

          # Check k3s_cluster has children
          assert 'children' in inv['k3s_cluster'], 'Missing children in k3s_cluster group'
          children = inv['k3s_cluster']['children']
          assert 'k3s_servers' in children, 'k3s_servers not in k3s_cluster children'
          assert 'k3s_workers' in children, 'k3s_workers not in k3s_cluster children'

          print('✅ Inventory structure correct (k3s_servers/k3s_workers groups)')
          "

  summary:
    name: Fork Maintenance Summary
    runs-on: ubuntu-latest
    needs: [upstream-divergence, check-fork-features, check-phase1-improvements, validate-inventory-structure]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "📋 Fork Maintenance Check Results:"
          echo "  - Upstream divergence: ${{ needs.upstream-divergence.result }}"
          echo "  - Fork features: ${{ needs.check-fork-features.result }}"
          echo "  - Phase 1 improvements: ${{ needs.check-phase1-improvements.result }}"
          echo "  - Inventory structure: ${{ needs.validate-inventory-structure.result }}"

          if [ "${{ needs.check-fork-features.result }}" != "success" ] || \
             [ "${{ needs.check-phase1-improvements.result }}" != "success" ] || \
             [ "${{ needs.validate-inventory-structure.result }}" != "success" ]; then
            echo "::error::❌ Some fork maintenance checks failed!"
            exit 1
          else
            echo "✅ All fork maintenance checks passed!"
          fi
